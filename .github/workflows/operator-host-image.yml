name: Publish Operator Host Image

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref containing the operator-host source
        required: true
        type: string
      image_tag:
        description: Image tag to publish
        required: true
        type: string
    outputs:
      digest:
        description: Published multi-platform manifest digest
        value: ${{ jobs.assemble.outputs.digest }}
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source ref to build (for example, v0.4.1)
        required: true
        type: string
      image_tag:
        description: Image tag to publish (for example, v0.4.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yehudacohen/applik8s-operator-host

jobs:
  validate:
    name: Validate immutable release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable release inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$IMAGE_TAG" = "$SOURCE_REF"
          elif [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            test "$IMAGE_TAG" = "sha-${SOURCE_REF:0:12}"
          else
            echo "source_ref must be an immutable semver tag or full commit SHA" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }} natively
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.operator-host
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.image_tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          cache-from: type=gha,scope=operator-host-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=operator-host-${{ matrix.suffix }}
          provenance: mode=max
          sbom: true

  assemble:
    name: Assemble and verify multi-platform image
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble immutable release manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$IMAGE_TAG" \
            "$IMAGE:$IMAGE_TAG-amd64" \
            "$IMAGE:$IMAGE_TAG-arm64"

      - name: Verify anonymous access, platforms, and record digest
        id: inspect
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # A package first published by this public repository inherits public
          # visibility. Prove that contract without relying on runner credentials.
          docker logout ghcr.io
          TOKEN="$(curl --fail --silent --show-error --get \
            --data-urlencode "scope=repository:yehudacohen/applik8s-operator-host:pull" \
            https://ghcr.io/token | jq -er '.token')"
          PUBLIC_DIGEST="$(curl --fail --silent --show-error --head \
            --header "Authorization: Bearer $TOKEN" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/yehudacohen/applik8s-operator-host/manifests/$IMAGE_TAG" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "published manifest did not produce a sha256 digest: $DIGEST" >&2
            exit 1
          fi
          if [[ "$PUBLIC_DIGEST" != "$DIGEST" ]]; then
            echo "anonymous manifest digest $PUBLIC_DIGEST did not match $DIGEST" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee /tmp/operator-host-manifest.txt
          grep -q 'Platform:.*linux/amd64' /tmp/operator-host-manifest.txt
          grep -q 'Platform:.*linux/arm64' /tmp/operator-host-manifest.txt
          {
            echo '### Operator host image'
            echo
            echo "- Tag: \`$IMAGE:$IMAGE_TAG\`"
            echo "- Digest: \`$DIGEST\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
          } >> "$GITHUB_STEP_SUMMARY"
