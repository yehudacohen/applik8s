name: Deploy applik8s Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish packages to npm using trusted publishing
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: APPLIK8S_RELEASE_VERSION="${GITHUB_REF_NAME#v}" bun run check:release

      - name: Run local gates
        run: bun run check:local

      - name: Run v0.4 durable-behavior gates
        run: bun run test:v04:local

      - name: Run package release checks
        run: bun run check:packages

      - name: Build ImageJob artifacts
        run: bun run build:imagejob

      - name: Build Tenant Platform v0.4 artifacts
        run: bun run build:tenant-platform-v04

      - name: Capture artifact listing
        run: find dist/applik8s dist/examples/tenant-platform-v04 -maxdepth 4 -type f | sort > dist/applik8s-artifact-list.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applik8s-release-evidence
          path: |
            dist/applik8s
            dist/examples/tenant-platform-v04
            dist/applik8s-artifact-list.txt

  publish-npm:
    name: Publish npm packages
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == 'true')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Node.js for npm with OIDC
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: APPLIK8S_RELEASE_VERSION="${GITHUB_REF_NAME#v}" bun run check:release

      - name: Publish packages to npm
        run: bun run publish:packages

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" --title "applik8s ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
