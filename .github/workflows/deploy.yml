name: Deploy applik8s Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing immutable release version to recover (X.Y.Z)
        required: true
        default: '0.7.2'
        type: string
      publish_npm:
        description: Publish packages to npm using trusted publishing
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  test:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release line
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then VERSION="${{ inputs.release_version }}"; fi
          LINE="v$(printf '%s' "${VERSION}" | cut -d. -f1,2)"
          printf 'line=%s\n' "${LINE}" >> "${GITHUB_OUTPUT}"
          printf 'lane=%s\n' "${LINE//./}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact-commit live evidence
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == 'true')
        run: node scripts/verify-v04-live-evidence.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLIK8S_RELEASE_LINE: ${{ steps.release.outputs.line }}

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: APPLIK8S_RELEASE_VERSION="${GITHUB_REF_NAME#v}" bun run check:release

      - name: Run legacy local gates
        if: ${{ steps.release.outputs.line != 'v0.4' && steps.release.outputs.line != 'v0.5' && steps.release.outputs.line != 'v0.6' && steps.release.outputs.line != 'v0.7' }}
        run: bun run check:local

      - name: Run v0.4 durable-behavior gates
        if: ${{ steps.release.outputs.line == 'v0.4' }}
        run: bun run test:v04:local

      - name: Run v0.5 durable-workflow gates and scorecard
        if: ${{ steps.release.outputs.line == 'v0.5' }}
        run: bun run check:v05:local

      - name: Run v0.6 native-model and reactive-application gates
        if: ${{ steps.release.outputs.line == 'v0.6' }}
        run: bun run check:v06:local

      - name: Run v0.7 Agentic Platform release gates
        if: ${{ steps.release.outputs.line == 'v0.7' }}
        run: bun run check:v07:local && TYPEKRO_LOG_LEVEL=fatal bun run scripts/check-v07-scorecard.ts --require-release

      - name: Run package release checks
        if: ${{ steps.release.outputs.line != 'v0.5' && steps.release.outputs.line != 'v0.6' && steps.release.outputs.line != 'v0.7' }}
        run: bun run check:packages

      - name: Review published consumer dependency audit
        run: bun run check:package-audit

      - name: Build ImageJob artifacts
        run: bun run build:imagejob

      - name: Build Tenant Platform v0.4 artifacts
        if: ${{ steps.release.outputs.line == 'v0.4' }}
        run: bun run build:tenant-platform-v04

      - name: Build Tenant Platform v0.5 artifacts
        if: ${{ steps.release.outputs.line == 'v0.5' }}
        run: bun run build:tenant-platform-v05

      - name: Build v0.6 generated application proof
        if: ${{ steps.release.outputs.line == 'v0.6' }}
        run: bun run build:v06-generated-proof

      - name: Capture artifact listing
        run: find dist/applik8s dist/examples/tenant-platform-* dist/examples/v06-generated-proof -maxdepth 4 -type f 2>/dev/null | sort > dist/applik8s-artifact-list.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applik8s-release-evidence
          path: |
            dist/applik8s
            dist/examples/tenant-platform-*
            dist/examples/v06-generated-proof
            dist/applik8s-artifact-list.txt

  publish-npm:
    name: Publish npm packages
    needs:
      - test
      - publish-host-image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == 'true')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Node.js for npm with OIDC
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: APPLIK8S_RELEASE_VERSION="${GITHUB_REF_NAME#v}" bun run check:release

      - name: Publish packages to npm
        run: bun run publish:packages

  publish-host-image:
    name: Publish operator host image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/operator-host-image.yml
    with:
      source_ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
      image_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}

  verify-published:
    name: Verify published npm and host artifacts
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Clean-install published packages and build with published host
        env:
          APPLIK8S_PUBLISHED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version }}
        run: node scripts/published-release-orbstack-smoke.mjs --build-only

  create-release:
    name: Create GitHub release
    needs: verify-published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "applik8s ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
