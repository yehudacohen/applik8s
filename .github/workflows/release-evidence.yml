name: Release Evidence

on:
  workflow_dispatch:
    inputs:
      run_live_e2e:
        description: Run live prerelease E2E with KUBECONFIG_B64 secret
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  evidence:
    name: v0.4 release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local gates
        run: bun run check:local

      - name: Run v0.4 durable-behavior gates
        run: bun run test:v04:local

      - name: Run package release checks
        run: bun run check:packages

      - name: Build ImageJob artifacts
        run: bun run build:imagejob

      - name: Build Tenant Platform v0.4 artifacts
        run: bun run build:tenant-platform-v04

      - name: Capture artifact listing
        run: find dist/applik8s dist/examples/tenant-platform-v04 -maxdepth 4 -type f | sort > dist/applik8s-artifact-list.txt

      - name: Configure live kubeconfig
        if: ${{ inputs.run_live_e2e == 'true' }}
        run: |
          if [ -z "${KUBECONFIG_B64}" ]; then
            echo "KUBECONFIG_B64 secret is required when run_live_e2e=true" >&2
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${KUBECONFIG_B64}" | base64 -d > ~/.kube/config
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: Run live prerelease gates
        if: ${{ inputs.run_live_e2e == 'true' }}
        run: APPLIK8S_E2E_CONTEXT=${APPLIK8S_E2E_CONTEXT} bun run check:v04:prerelease
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applik8s-v0.4-release-evidence
          path: |
            dist/applik8s
            dist/examples/tenant-platform-v04
            dist/applik8s-artifact-list.txt
