name: Release Evidence

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: Release line to attest
        required: true
        default: 'v0.9'
        type: choice
        options:
          - 'v0.9'
          - 'v0.8'
          - 'v0.7'
          - 'v0.6'
          - 'v0.5'
          - 'v0.4'
      run_live_e2e:
        description: Run live prerelease E2E with KUBECONFIG_B64 secret
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      live_attestation_b64:
        description: Optional base64 exact-commit attestation; gzip-compressed JSON for v0.9
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  evidence:
    name: ${{ inputs.release_line }} release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run legacy local gates
        if: ${{ inputs.release_line != 'v0.4' && inputs.release_line != 'v0.5' && inputs.release_line != 'v0.6' && inputs.release_line != 'v0.7' && inputs.release_line != 'v0.8' && inputs.release_line != 'v0.9' }}
        run: bun run check:local

      - name: Run v0.4 durable-behavior gates
        if: ${{ inputs.release_line == 'v0.4' }}
        run: bun run test:v04:local

      - name: Run v0.5 durable-workflow gates and scorecard
        if: ${{ inputs.release_line == 'v0.5' }}
        run: bun run check:v05:local

      - name: Run v0.6 native-model and reactive-application gates
        if: ${{ inputs.release_line == 'v0.6' }}
        run: bun run check:v06:local

      - name: Run v0.7 Agentic Platform release gates
        if: ${{ inputs.release_line == 'v0.7' }}
        run: bun run check:v07:local && TYPEKRO_LOG_LEVEL=fatal bun run scripts/check-v07-scorecard.ts --require-release

      - name: Run v0.8 portable stateful runtime local qualification
        if: ${{ inputs.release_line == 'v0.8' }}
        run: bun run check:v08:local-qualification

      - name: Run v0.9 semantic-completion candidate gates
        if: ${{ inputs.release_line == 'v0.9' }}
        run: bun run check:v09:ci

      - name: Run package release checks
        if: ${{ inputs.release_line != 'v0.5' && inputs.release_line != 'v0.6' && inputs.release_line != 'v0.7' && inputs.release_line != 'v0.8' && inputs.release_line != 'v0.9' }}
        run: bun run check:packages

      - name: Review published consumer dependency audit
        run: bun run check:package-audit

      - name: Build ImageJob artifacts
        run: bun run build:imagejob

      - name: Build Tenant Platform v0.4 artifacts
        if: ${{ inputs.release_line == 'v0.4' }}
        run: bun run build:tenant-platform-v04

      - name: Build Tenant Platform v0.5 artifacts
        if: ${{ inputs.release_line == 'v0.5' }}
        run: bun run build:tenant-platform-v05

      - name: Build v0.6 generated application proof
        if: ${{ inputs.release_line == 'v0.6' }}
        run: bun run build:v06-generated-proof

      - name: Capture artifact listing
        run: find dist/applik8s dist/examples/tenant-platform-* dist/examples/v06-generated-proof -maxdepth 4 -type f 2>/dev/null | sort > dist/applik8s-artifact-list.txt

      - name: Configure live kubeconfig
        if: ${{ inputs.release_line != 'v0.8' && inputs.release_line != 'v0.9' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: |
          if [ -z "${KUBECONFIG_B64}" ]; then
            echo "KUBECONFIG_B64 secret is required when run_live_e2e=true" >&2
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${KUBECONFIG_B64}" | base64 -d > ~/.kube/config
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: Run v0.4 live prerelease gates
        if: ${{ inputs.release_line == 'v0.4' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: APPLIK8S_E2E_CONTEXT=${APPLIK8S_E2E_CONTEXT} bun run check:v04:prerelease
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}

      - name: Run v0.5 live prerelease gates
        if: ${{ inputs.release_line == 'v0.5' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: APPLIK8S_E2E_CONTEXT=${APPLIK8S_E2E_CONTEXT} bun run test:v05:live
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}

      - name: Run v0.6 live prerelease gates
        if: ${{ inputs.release_line == 'v0.6' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: bun run test:v06:full-live
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}

      - name: Run v0.7 live prerelease gates
        if: ${{ inputs.release_line == 'v0.7' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: bun run check:v07:prerelease:orbstack
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}

      - name: Require aggregated v0.8 target evidence
        if: ${{ inputs.release_line == 'v0.8' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: |
          echo "v0.8 combines real AWS, Cilium-managed Kubernetes, multi-architecture image, and browser receipts." >&2
          echo "Supply the exact-commit aggregated attestation through live_attestation_b64." >&2
          exit 1

      - name: Require aggregated v0.9 exact-candidate evidence
        if: ${{ inputs.release_line == 'v0.9' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: |
          echo "v0.9 requires the gzip-compressed aggregate produced by scripts/write-v09-release-attestation.ts." >&2
          echo "Run every required suite on the exact clean commit, then supply the base64 gzip through live_attestation_b64." >&2
          exit 1

      - name: Record complete v0.6 exact-commit live evidence
        if: ${{ inputs.release_line == 'v0.6' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: bun run scripts/write-v06-release-attestation.mjs --out dist/applik8s-v0.6-live-evidence.json
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}

      - name: Record exact-commit live evidence
        if: ${{ inputs.release_line != 'v0.6' && inputs.release_line != 'v0.8' && inputs.release_line != 'v0.9' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 == '' }}
        run: |
          node -e 'const fs=require("node:fs"); const line=process.env.RELEASE_LINE; const lane=line.replace(".",""); fs.mkdirSync("dist",{recursive:true}); fs.writeFileSync(`dist/applik8s-${line}-live-evidence.json`, JSON.stringify({schemaVersion:1,releaseLine:line,commit:process.env.GITHUB_SHA,execution:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,context:process.env.APPLIK8S_E2E_CONTEXT,suite:`check:${lane}:prerelease`,generatedAt:new Date().toISOString()},null,2)+"\n")'
        env:
          APPLIK8S_E2E_CONTEXT: ${{ vars.APPLIK8S_E2E_CONTEXT }}
          RELEASE_LINE: ${{ inputs.release_line }}

      - name: Validate maintainer-run exact-commit live evidence
        if: ${{ inputs.release_line != 'v0.8' && inputs.release_line != 'v0.9' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 != '' }}
        run: |
          mkdir -p dist
          printf '%s' "${LIVE_ATTESTATION_B64}" | base64 -d > "dist/applik8s-${RELEASE_LINE}-live-evidence.json"
          APPLIK8S_RELEASE_LINE="${RELEASE_LINE}" node scripts/verify-v04-live-evidence.mjs --file "dist/applik8s-${RELEASE_LINE}-live-evidence.json" --commit "${GITHUB_SHA}"
        env:
          LIVE_ATTESTATION_B64: ${{ inputs.live_attestation_b64 }}
          RELEASE_LINE: ${{ inputs.release_line }}

      - name: Validate aggregated v0.8 exact-commit target evidence
        if: ${{ inputs.release_line == 'v0.8' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 != '' }}
        run: |
          mkdir -p dist
          printf '%s' "${LIVE_ATTESTATION_B64}" | base64 -d > dist/applik8s-v0.8-live-evidence.json
          node scripts/verify-v08-live-evidence.mjs --file dist/applik8s-v0.8-live-evidence.json --commit "${GITHUB_SHA}"
        env:
          LIVE_ATTESTATION_B64: ${{ inputs.live_attestation_b64 }}

      - name: Validate aggregated v0.9 exact-commit target evidence
        if: ${{ inputs.release_line == 'v0.9' && inputs.run_live_e2e == 'true' && inputs.live_attestation_b64 != '' }}
        run: |
          mkdir -p dist
          printf '%s' "${LIVE_ATTESTATION_B64}" | base64 -d | gzip -d > dist/applik8s-v0.9-live-evidence.json
          bun run scripts/verify-v09-live-evidence.ts --file dist/applik8s-v0.9-live-evidence.json --commit "${GITHUB_SHA}"
        env:
          LIVE_ATTESTATION_B64: ${{ inputs.live_attestation_b64 }}

      - name: Upload exact-commit live attestation
        if: ${{ inputs.run_live_e2e == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applik8s-${{ inputs.release_line }}-live-${{ github.sha }}
          path: dist/applik8s-${{ inputs.release_line }}-live-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applik8s-${{ inputs.release_line }}-release-evidence
          path: |
            dist/applik8s
            dist/examples/tenant-platform-*
            dist/examples/v06-generated-proof
            dist/applik8s-artifact-list.txt
