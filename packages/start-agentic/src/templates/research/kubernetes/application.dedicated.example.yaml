apiVersion: applik8s-template-project.applik8s.dev/v1alpha1
kind: Applik8sTemplateProject
metadata:
  name: applik8s-template-project-dedicated
  namespace: applik8s-template-project-control
spec:
  name: applik8s-template-project-dedicated
  profile: dedicated
  providers:
    inference:
      endpoint: https://inference.example.test/v1
      model: product-assistant-v1
      credentialSecretName: product-inference
      credentialKey: apiKey
      credentialSource:
        kind: existingSecret
    identity:
      issuer: https://identity.example.test
    objects:
      deviceStorageClassName: ceph-block
    payments:
      secretName: product-payments
      endpoint: https://api.stripe.com/v1
      apiKeyKey: apiKey
      webhookSecretKey: webhookSecret
      credentialSource:
        kind: existingSecret
    notifications:
      host: smtp.example.test
      port: 587
      secretName: product-notifications
      usernameKey: username
      passwordKey: password
      senderEmail: notifications@example.test
      senderName: Product
      credentialSource:
        kind: existingSecret
    webSearch:
      secretName: product-web-search
      secretKey: secret_key
      replicas: 3
