apiVersion: applik8s-template-project.applik8s.dev/v1alpha1
kind: Applik8sTemplateProject
metadata:
  name: applik8s-template-project-developer
  namespace: default
spec:
  name: applik8s-template-project
  profile: developer
  providers:
    inference:
      endpoint: https://openrouter.ai/api/v1
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      credentialSecretName: applik8s-template-project-inference
      credentialKey: apiKey
      credentialSource:
        kind: hostEnvironment
        variable: OPENROUTER_API_KEY
    payments:
      secretName: applik8s-template-project-payments
      endpoint: https://api.stripe.com/v1
      apiKeyKey: apiKey
      webhookSecretKey: webhookSecret
      credentialSource:
        kind: hostEnvironment
        apiKeyVariable: STRIPE_SECRET_KEY
        webhookSecretVariable: STRIPE_WEBHOOK_SECRET
