[package]
name = "applik8s-runtime-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
applik8s-runtime-contract = { path = "../applik8s-runtime-contract" }
bytes = "1"
http-body-util = "0.1"
json-patch = "4"
http = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-rustls = "0.26"
wasmtime = { version = "45.0.2", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "45.0.2", default-features = false, features = ["p2"] }
wasmtime-wasi-http = "45.0.2"
webpki-roots = "1"

[dev-dependencies]
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
rcgen = "0.14"
wat = "1"
